name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Forbid TS parameter properties (Node strip-only incompatible)
        run: |
          ! grep -rn "constructor(\(private\|public\|protected\|readonly\) " src/ test/ scripts/
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
